name: DB Backup

# Supabase DB를 매일 pg_dump → gzip → Cloudflare R2 업로드. 14일 보존, 실패 시 텔레그램 알림.
#
# ⚠️ 주의사항
# - SUPABASE_DB_URL은 반드시 "Session pooler" 접속 문자열(포트 5432,
#   aws-*.pooler.supabase.com)을 쓸 것. GitHub Actions 러너는 IPv4 전용인데
#   Supabase 직접 연결(db.*.supabase.co)은 IPv6라 연결 실패함. Session pooler는 IPv4 지원.
# - 저장소가 Public이므로 모든 민감정보는 GitHub Secrets로만 관리(하드코딩 절대 금지).
#   필요 Secrets: SUPABASE_DB_URL, R2_BUCKET, R2_ACCOUNT_ID,
#                 R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#                 TELEGRAM_BOT_TOKEN, TELEGRAM_ADMIN_CHAT_ID
# - 백업 덤프는 개인정보를 포함하므로 R2에만 저장. Actions 아티팩트로 남기지 말 것
#   (actions/upload-artifact 사용 금지 — 러너 로컬 파일은 job 종료 시 자동 소멸).

on:
  schedule:
    # UTC 19:00 = KST 04:00 매일
    - cron: '0 19 * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Supabase Postgres 버전과 pg_dump 메이저 버전이 맞아야 함.
      # PGDG apt 저장소를 추가해 postgresql-client-17 고정 설치
      # (서버가 15여도 17 클라이언트로 상위호환 덤프 가능).
      - name: Install PostgreSQL client 17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          # 무관한 서드파티 저장소(MS 등) 장애가 백업을 죽이지 않도록 PGDG만 갱신
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list.d/pgdg.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      # 러너 기본 pg_dump(16)가 PATH 우선이라 17 바이너리 전체 경로로 직접 실행 (서버 17.x 대응)
      - name: pg_dump and gzip
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          FILENAME="backup-$(date -u +%Y%m%d-%H%M).sql.gz"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges | gzip > "$FILENAME"
          ls -lh "$FILENAME"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          aws s3 cp "$FILENAME" "s3://${{ secrets.R2_BUCKET }}/backups/" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      # 14일 지난 백업 삭제 — 파일명의 날짜(YYYYMMDD) 기준으로만 판정(메타데이터 의존 금지).
      - name: Delete backups older than 14 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          CUTOFF=$(date -u -d '14 days ago' +%Y%m%d)
          echo "보존 기준일(이전이면 삭제): $CUTOFF"

          aws s3 ls "s3://${{ secrets.R2_BUCKET }}/backups/" --endpoint-url "$ENDPOINT" \
            | awk '{print $4}' | grep -E '^backup-[0-9]{8}-[0-9]{4}\.sql\.gz$' > all_backups.txt || true

          > to_delete.txt
          while read -r key; do
            filedate=$(echo "$key" | sed -E 's/^backup-([0-9]{8})-[0-9]{4}\.sql\.gz$/\1/')
            if [ "$filedate" -lt "$CUTOFF" ]; then
              echo "$key" >> to_delete.txt
            fi
          done < all_backups.txt

          if [ -s to_delete.txt ]; then
            echo "삭제 대상:"
            cat to_delete.txt
            while read -r key; do
              aws s3 rm "s3://${{ secrets.R2_BUCKET }}/backups/$key" --endpoint-url "$ENDPOINT"
            done < to_delete.txt
          else
            echo "삭제 대상 없음"
          fi

      # 실패 시에만 텔레그램 알림(성공 알림은 소음 방지 차원에서 보내지 않음).
      - name: Notify failure via Telegram
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }} \
            -d text="⚠️ Daily Digest DB 백업 실패: $(date -u +%Y-%m-%d) — GitHub Actions 로그 확인 필요"
