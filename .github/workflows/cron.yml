name: Daily Digest Cron

on:
  schedule:
    # 15분마다 실행 (UTC 기준)
    - cron: '*/15 * * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel Cron API
        run: |
          curl -X GET "https://daily-digest-one-vert.vercel.app/api/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
